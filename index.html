let player='',score=0,answered=0,deck=[],pos=0,locked=false;
const $=id=>document.getElementById(id);
const SUPABASE_URL='https://btpxspchdaebtvpuqqnj.supabase.co';
const SUPABASE_KEY='sb_publishable_La4_1rLgOFJLgyNevFve7w_ZVQ5Apl8';
async function sb(path,opts={}){const res=await fetch(SUPABASE_URL+'/rest/v1/'+path,{...opts,headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY,'Content-Type':'application/json',...(opts.headers||{})}});if(!res.ok)throw new Error(await res.text());return res.status===204?null:res.json()}
async function renderGlobal(){try{const rows=await sb('quiz_scores?select=nickname,score&order=score.desc&limit=10');$('ranking').innerHTML=rows.length?'<table><tr><th>순위</th><th>닉네임</th><th>점수</th></tr>'+rows.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.nickname)}</td><td>${x.score}</td></tr>`).join('')+'</table>':'아직 기록이 없습니다.'}catch(e){$('ranking').innerHTML='전체 랭킹 연결 오류: '+esc(e.message)}}
function records(){try{return JSON.parse(localStorage.getItem('ghQuizRecords')||'{}')}catch(e){return {}}}
function saveRecords(r){localStorage.setItem('ghQuizRecords',JSON.stringify(r));renderRecords()}
function renderRecords(){let r=records(),mine=r[player]||{score:0,played:0};$('myrecord').innerHTML=`<div class="row"><span>${player||'닉네임 미입력'}</span><b>${mine.score}점 · ${mine.played}문제</b></div>`;renderGlobal()}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function start(){player=$('nick').value.trim()||player||'플레이어';$('nick').value=player;score=0;answered=0;deck=[...BANK.keys()];shuffle(deck);pos=0;$('home').style.display='none';$('result').style.display='none';$('play').style.display='block';show();}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}}
function show(){if(pos>=deck.length){shuffle(deck);pos=0}locked=false;let q=BANK[deck[pos]];$('category').textContent=q.cat;$('score').textContent=score+'점';$('count').textContent=`이번 세션 ${answered+1}문제 · 전체 ${BANK.length}문제 중 랜덤`;$('question').textContent=q.q;$('bar').style.width=((pos+1)/BANK.length*100)+'%';$('options').innerHTML=q.opts.map((o,i)=>`<button class="option" onclick="choose(${i})">${['①','②','③','④'][i]} ${esc(o)}</button>`).join('');$('feedback').textContent='';$('next').style.display='none'}
function choose(i){if(locked)return;locked=true;let q=BANK[deck[pos]],buttons=$('options').querySelectorAll('button');answered++;if(i===q.a){score+=100;$('feedback').innerHTML='<span class="good">정답! +100점</span>'}else{$('feedback').innerHTML='<span class="bad">오답 · 정답: '+esc(q.opts[q.a])+'</span>'}$('score').textContent=score+'점';buttons.forEach((b,k)=>{b.disabled=true;if(k===q.a)b.style.background='#24634d';else if(k===i)b.style.background='#713846'});$('next').style.display='block'}
function next(){pos++;show()}
async function quit(){let r=records(),old=r[player]||{score:0,played:0};r[player]={score:old.score+score,played:old.played+answered};saveRecords(r);$('play').style.display='none';$('result').style.display='block';$('summary').innerHTML=`<p>${esc(player)}님, 이번 플레이</p><h1 style="text-align:left">${score}점</h1><p>${answered}문제 풀이 · 누적 ${r[player].score}점</p><p id="serverStatus">서버에 점수 저장 중...</p>`;try{await sb('rpc/add_quiz_score',{method:'POST',body:JSON.stringify({p_nickname:player,p_score:score})});$('serverStatus').textContent='친구들과 공유되는 서버 랭킹에 저장 완료!';await renderGlobal()}catch(e){$('serverStatus').textContent='서버 저장 실패: '+e.message+' (SQL 설정 확인 필요)'}}
function home(){$('result').style.display='none';$('home').style.display='block';renderRecords()}
$('nick').addEventListener('keydown',e=>{if(e.key==='Enter')start()});renderRecords();
